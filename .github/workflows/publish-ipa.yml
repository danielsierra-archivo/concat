name: publish-ipa

# Takes the iOS build artifact of an earlier "mobile" run and attaches it to a
# GitHub Release, so it can be downloaded from the Releases page.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the mobile workflow that built the artifact
        required: true
        default: "38032803826"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish IPA
    runs-on: ubuntu-latest
    steps:
      - name: Download the iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Concat-ios-arm64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ipa

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          ls -R ipa
          gh release create "ios-$RUN_ID" ipa/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Concat iOS (default folder fix)" \
            --notes "Unsigned iOS build from run $RUN_ID. Default project folder is Documents/Concat and Documents is exposed in the Files app. Sideload it."
